name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install

      # The backend URL is baked into the manifest's host_permissions. A release
      # without it would ship an extension that can only talk to localhost.
      - name: Check release configuration
        env:
          SITE_BASE: ${{ vars.WXT_SITE_BASE }}
        run: |
          if [ -z "$SITE_BASE" ]; then
            echo "::error::Repository variable WXT_SITE_BASE is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      # Chrome 与 Edge（以及其它 Chromium 浏览器）共用同一份 MV3 包，所以这里
      # 只构建一次；`scripts/rename-zip.mjs` 会把产物名从 `-chrome` 改成
      # `-chromium`，避免让人以为 Edge 需要单独的构建。
      - name: Build Chromium zip (Chrome + Edge)
        env:
          WXT_SITE_BASE: ${{ vars.WXT_SITE_BASE }}
          WXT_STRICT_SITE: '1'
        run: bun run zip

      - name: Build Firefox zip
        env:
          WXT_SITE_BASE: ${{ vars.WXT_SITE_BASE }}
          WXT_STRICT_SITE: '1'
        run: bun run zip:firefox

      - name: Checksums
        run: |
          cd .output
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
            .output/SHA256SUMS.txt
          generate_release_notes: true
