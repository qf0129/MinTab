name: Feature request
description: 新功能或体验改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。请说明**使用场景**，而不只是"加一个按钮"——这能帮助判断该不该做、
        以及怎么做才不会破坏最小权限和本地优先的定位。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 现在是怎么用的？哪一步不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 浏览器自带功能、其他扩展、或者不改代码也能绕过的办法
  - type: checkboxes
    id: impact
    attributes:
      label: 影响面
      options:
        - label: 需要新增浏览器权限（会显著增加审核与信任成本）
        - label: 需要后端配合（见 docs/api-contract.md）
        - label: 只是本地 UI/逻辑改动
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue
          required: true
